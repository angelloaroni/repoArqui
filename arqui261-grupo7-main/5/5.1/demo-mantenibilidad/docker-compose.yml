services:

  vault:
    image: hashicorp/vault:latest
    container_name: vault

    ports:
      - "8200:8200"

    environment:
      VAULT_DEV_ROOT_TOKEN_ID: root
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200

    cap_add:
      - IPC_LOCK

    command: server -dev

  init-vault:
    build: ./init-vault

    depends_on:
      - vault

  auth-service:
    build: ./auth-service

    ports:
      - "3002:3000"

    depends_on:
      - vault
      - init-vault