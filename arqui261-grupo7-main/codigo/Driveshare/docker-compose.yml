services:

  postgres:
    image: postgres:16
    container_name: driveshare-db
    restart: always

    environment:
      POSTGRES_DB: driveshare
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456

    ports:
      - "5439:5432"

    volumes:
      - driveshare-postgres-data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: driveshare-pgadmin
    restart: always

    environment:
      PGADMIN_DEFAULT_EMAIL: admin@driveshare.com
      PGADMIN_DEFAULT_PASSWORD: admin123

    ports:
      - "5059:80"

    depends_on:
      - postgres

  vault:
    image: hashicorp/vault:latest
    container_name: driveshare-vault
    restart: always

    ports:
      - "8200:8200"

    environment:
      VAULT_DEV_ROOT_TOKEN_ID: root
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"

    cap_add:
      - IPC_LOCK

    command: server -dev

  backend:
    build: ./DriveShare-Backend
    container_name: driveshare-backend
    restart: always

    ports:
      - "3000:3000"

    env_file:
      - ./DriveShare-Backend/.env.docker

    depends_on:
      - postgres
      - vault

  frontend:
    build: ./DriveShare-Frontend
    container_name: driveshare-frontend
    restart: always

    ports:
      - "5173:5173"

    depends_on:
      - backend

  audit-sidecar:
    build: ./DriveShare-Audit
    container_name: driveshare-audit
    restart: always

    ports:
      - "4000:4000"

    env_file:
      - ./DriveShare-Audit/.env

    depends_on:
      - postgres

volumes:
  driveshare-postgres-data: